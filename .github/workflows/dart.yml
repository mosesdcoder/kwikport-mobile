name: iOS-ipa-build

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: 🎉 iOS Build
    runs-on: macos-14  # Use macOS 14 to get newer Xcode

    steps:
      # 🛠️ 1. Checkout source
      - uses: actions/checkout@v3

      # 🛠️ 2. Select Xcode 15.4 (supports iOS 17/18 SDKs)
      - name: Select Xcode
        run: sudo xcode-select -s "/Applications/Xcode_15.4.app"

      # 🛠️ 3. Install Flutter
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64

      # 🛠️ 4. Get dependencies
      - run: flutter pub get

      # 🛠️ 5. Update CocoaPods
      - run: pod repo update
        working-directory: ios

      # 🛠️ 6. Build iOS without codesign
      - run: flutter build ios --release --no-codesign

      # 🛠️ 7. Prepare Payload folder for .ipa
      - run: mkdir Payload
        working-directory: build/ios/iphoneos

      - run: mv Runner.app/ Payload
        working-directory: build/ios/iphoneos

      # 🛠️ 8. Create IPA file
      - name: Zip output
        run: zip -qq -r -9 FlutterIpaExport.ipa Payload
        working-directory: build/ios/iphoneos

      # 🛠️ 9. Ensure Git tag exists (auto-create if missing)
      - name: Ensure release tag
        run: |
          git fetch --tags
          if ! git rev-parse v1.0 >/dev/null 2>&1; then
            echo "Tag v1.0 not found. Creating..."
            git tag v1.0
            git push origin v1.0
          else
            echo "Tag v1.0 already exists."
          fi

      # 🛠️ 10. Upload IPA to GitHub release
      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/ios/iphoneos/FlutterIpaExport.ipa
          asset_name: FlutterIpaExport.ipa
          tag: v1.0
          release_name: "iOS Build v1.0"
          overwrite: true
          make_latest: true
          body: "🚀 First automated iOS IPA build uploaded by GitHub Actions."
